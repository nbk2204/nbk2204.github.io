<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NBK NEXUS // Secure Access</title>
    <style>
        :root {
            --bg-color: #0a051b;
            --glass-panel: rgba(20, 10, 35, 0.7);
            --neon-purple: #bc13fe;
            --neon-cyan: #00f3ff;
            --neon-red: #ff003c;
            --text-main: #e0d5f5;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', monospace;
            margin: 0;
            overflow-x: hidden;
        }

        /* LOGIN MODAL (High Security Look) */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .login-box {
            background: rgba(10, 5, 20, 0.9);
            border: 1px solid var(--neon-cyan);
            padding: 40px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
            position: relative;
        }

        .login-box::before {
            content: "AUTHENTICATION REQUIRED";
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            background: var(--bg-color);
            padding: 0 10px;
            color: var(--neon-cyan);
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            padding: 10px;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
        }

        input:focus { border-color: var(--neon-purple); }

        button {
            width: 100%;
            padding: 10px;
            background: var(--neon-purple);
            border: none;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover { box-shadow: 0 0 15px var(--neon-purple); }

        /* DASHBOARD LAYOUT */
        #dashboard { display: none; padding: 20px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .admin-controls {
            display: none; /* Hidden by default */
            background: rgba(255, 0, 60, 0.1);
            border: 1px solid var(--neon-red);
            padding: 10px;
            margin-bottom: 20px;
            color: var(--neon-red);
            font-size: 0.8rem;
        }

        /* GRID & SERVER CARDS */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--glass-panel);
            border: 1px solid rgba(188, 19, 254, 0.3);
            padding: 20px;
            border-radius: 8px;
            transition: 0.3s;
            position: relative;
        }

        /* UNAUTHORIZED STATE (Grayscale) */
        .card.locked {
            filter: grayscale(100%) brightness(0.4);
            pointer-events: none; /* Prevents clicking */
            border-style: dashed;
        }

        .card.locked::after {
            content: "🔒 LOCKED";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-weight: bold;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px black;
            filter: none; /* Attempt to keep text visible, but parent filter overrides */
        }
        
        /* AUTHORIZED STATE (Neon) */
        .card.unlocked {
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.2);
            border-color: var(--neon-cyan);
        }

        .card.unlocked:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 25px var(--neon-cyan);
        }

        .server-link {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 15px;
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-cyan);
            text-decoration: none;
            border: 1px solid var(--neon-cyan);
        }
    </style>
</head>
<body>

    <!-- SECURE LOGIN OVERLAY -->
    <div id="login-overlay">
        <div class="login-box">
            <h2 style="margin-bottom: 20px;">SYSTEM ACCESS</h2>
            <input type="email" id="email" placeholder="OPERATOR ID (Email)">
            <input type="password" id="password" placeholder="ACCESS CODE (Password)">
            <button onclick="handleLogin()">INITIATE SEQUENCE</button>
            <p id="error-msg" style="color:red; font-size: 0.8rem; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard">
        <header>
            <div>
                <h1>NBK NEXUS</h1>
                <small id="user-display">GUEST MODE</small>
            </div>
            <button onclick="logout()" style="width: auto; background: #333;">ABORT SESSION</button>
        </header>

        <!-- ADMIN ONLY PANEL -->
        <div id="admin-panel" class="admin-controls">
            <strong>⚠️ ROOT ACCESS GRANTED:</strong> You can see all hidden nodes and server diagnostics.
        </div>

        <div class="grid" id="server-grid">
            <!-- Cards will be injected here by JavaScript -->
        </div>
    </div>

    <!-- FIREBASE SDK (Versions 9+ compat for simplicity) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // --- 1. PASTE YOUR FIREBASE CONFIG HERE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDnJUgPBsVxnteisxR6CZQ1_XZCHbp_s34",
            authDomain: "nbk-nexus.firebaseapp.com",
            projectId: "nbk-nexus",
            storageBucket: "nbk-nexus.firebasestorage.app",
            messagingSenderId: "324577021220",
            appId: "1:324577021220:web:99b0ed6f9f0831acf1f7b1"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // --- 2. CONFIGURATION: YOUR SERVERS ---
        // Define which roles can see which servers
        const servers = [
            {
                id: 1,
                name: "PUBLIC NODE",
                desc: "Family & Friend Access",
                url: "http://public-server.com",
                minRole: "guest" // Everyone sees this
            },
            {
                id: 2,
                name: "MEDIA CORE",
                desc: "Plex / Jellyfin Streaming",
                url: "http://media-server.com",
                minRole: "friend" // Only friends and admins
            },
            {
                id: 3,
                name: "SENTINEL OPS",
                desc: "Security Cameras & Logs",
                url: "http://secure-server.com",
                minRole: "admin" // Only you
            }
        ];

        // --- 3. LOGIC ---
        
        function handleLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            
            auth.signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    // Login successful
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    loadDashboard(userCredential.user.email);
                })
                .catch((error) => {
                    document.getElementById('error-msg').innerText = "ACCESS DENIED: " + error.message;
                });
        }

        function logout() {
            auth.signOut().then(() => {
                location.reload(); // Reset page
            });
        }

        function loadDashboard(email) {
            document.getElementById('user-display').innerText = "OPERATOR: " + email;

            // Determine Role (Simple email check for now)
            // In a real app, you'd use Firebase Custom Claims
            let role = "guest";
            if (email === "crazybuddiescreations@gmail.com") {
                role = "admin";
                document.getElementById('admin-panel').style.display = "block";
            } else if (email.includes("friend")) {
                role = "friend";
            }

            renderGrid(role);
        }

        function renderGrid(userRole) {
            const grid = document.getElementById('server-grid');
            grid.innerHTML = ""; // Clear existing

            servers.forEach(server => {
                const card = document.createElement('div');
                let isUnlocked = false;

                // Authorization Logic hierarchy
                if (userRole === "admin") isUnlocked = true;
                else if (userRole === "friend" && (server.minRole === "friend" || server.minRole === "guest")) isUnlocked = true;
                else if (userRole === "guest" && server.minRole === "guest") isUnlocked = true;

                // Apply CSS Classes
                const statusClass = isUnlocked ? "unlocked" : "locked";
                
                card.className = `card ${statusClass}`;
                card.innerHTML = `
                    <h3>${server.name}</h3>
                    <p style="color: #aaa; font-size: 0.9rem;">${server.desc}</p>
