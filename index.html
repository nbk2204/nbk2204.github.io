    <style>

            --neon-red: #ff003c;

        body {

            margin: 0;

        #login-overlay {

            background: rgba(4, 2, 10, 0.98);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(12px);
        }

        .login-box {
            background: var(--glass-panel);
            border: 1px solid var(--neon-cyan);
            padding: 40px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);

            border-radius: 8px;
        }

        .login-box::before {

            position: absolute;
            top: -10px; left: 50%;

            padding: 0 10px;
            color: var(--neon-cyan);
            font-size: 0.65rem;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 12px;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
            box-sizing: border-box;
            border-radius: 4px;

        input:focus { border-color: var(--neon-purple); box-shadow: 0 0 10px rgba(188, 19, 254, 0.3); }

        .nexus-btn {
            width: 100%;
            padding: 12px;
            background: var(--neon-purple);
            border: none;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(188, 19, 254, 0.2);
        }

        .nexus-btn:hover { box-shadow: 0 0 20px var(--neon-purple); background: #cc2efe; }

        #dashboard { display: none; padding: 25px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .admin-controls {
            display: none;
            background: rgba(255, 0, 60, 0.08);
            border: 1px solid var(--neon-red);
            padding: 12px;
            margin-bottom: 25px;
            color: #ff99ae;
            font-size: 0.85rem;
            border-radius: 4px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--glass-panel);
            border: 1px solid rgba(188, 19, 254, 0.2);
            padding: 25px;
            border-radius: 12px;
            position: relative;
            transition: all 0.3s ease;
        }

        .card.unlocked {
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.15);
        }

        .card.unlocked:hover {
            transform: translateY(-4px);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
        }

        .card.locked {
            filter: grayscale(100%) brightness(0.3);
            border-style: dashed;
            cursor: not-allowed;
        }

        .card.locked .server-link {
            pointer-events: none;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.2);
            border-color: transparent;
        }

        .server-link {
            display: block;

            margin-top: 20px;
            padding: 10px;
            background: rgba(0, 243, 255, 0.08);

            border: 1px solid var(--neon-cyan);
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
        }
    </style>
