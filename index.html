<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON NEXUS // Central Command</title>
    <style>
        :root {
            --bg-color: #0a051b;
            --panel-bg: rgba(20, 10, 35, 0.6);
            --neon-purple: #bc13fe;
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --text-main: #e0d5f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(188, 19, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 127, 0.15) 0%, transparent 40%);
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid rgba(188, 19, 254, 0.3);
            background: rgba(10, 5, 27, 0.8);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-purple), 0 0 20px var(--neon-purple);
            margin-bottom: 10px;
        }

        .status-bar {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            border-radius: 20px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* User Management Panel */
        .user-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 0, 127, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 40px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
            background: #2a1435;
        }

        .tier-badge {
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-pink));
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .auth-btn {
            background: transparent;
            border: 1px solid var(--neon-pink);
            color: #fff;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .auth-btn:hover {
            background: var(--neon-pink);
            box-shadow: 0 0 15px var(--neon-pink);
        }

        /* Servers Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid rgba(188, 19, 254, 0.2);
            border-radius: 12px;
            padding: 25px;
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-pink));
            opacity: 0.7;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Infographics Elements */
        .infographic-mini {
            margin: 15px 0;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 12px;
            border: 1px solid rgba(224, 213, 245, 0.05);
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 6px;
            color: #a295c0;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.05);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            box-shadow: 0 0 8px var(--neon-cyan);
        }

        /* Access States */
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-online {
            background-color: #00ff66;
            box-shadow: 0 0 8px #00ff66;
        }

        .access-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 27, 0.9);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* Class rule when server is locked for a specific user tier */
        .card.restricted .access-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        .lock-icon {
            font-size: 2rem;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            margin-bottom: 10px;
        }

        .lock-text {
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffb3d1;
        }

        .btn-link {
            display: block;
            text-align: center;
            background: rgba(188, 19, 254, 0.1);
            border: 1px solid var(--neon-purple);
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .btn-link:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-purple);
        }
    </style>
</head>
<body>

    <header>
        <h1>Neon Nexus</h1>
        <div class="status-bar">Central Server Matrix Hub</div>
    </header>

    <div class="container">
        
        <div class="user-panel">
            <div class="user-info">
                <div class="user-avatar"></div>
                <div>
                    <div style="font-weight: bold; font-size: 1.1rem;">Guest Session</div>
                    <div style="color: #a295c0; font-size: 0.85rem; margin-top: 4px;">
                        Access Level: <span class="tier-badge" style="background: #444;">Tier 3: Guest</span>
                    </div>
                </div>
            </div>
            <button class="auth-btn" onclick="toggleDemoTier()">Simulate Login (Toggle Tier)</button>
        </div>

        <!-- Servers Grid -->
        <div class="grid">
            
            <!-- Server 1: Public Base -->
            <div class="card" id="server1">
                <div class="card-header">
                    <span class="card-title">Public Portal</span>
                    <span class="status-indicator status-online"></span>
                </div>
                <p style="font-size: 0.9rem; color: #a295c0;">Shared public services node accessible by family and friends.</p>
                
                <div class="infographic-mini">
                    <div class="metric-row"><span>Network Load</span><span>24%</span></div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: 24%;"></div></div>
                </div>
                <a href="https://your-server-url-1.com" target="_blank" class="btn-link">Establish Link</a>
                
                <div class="access-overlay">
                    <div class="lock-icon">🔒</div>
                    <div class="lock-text">Access Restricted</div>
                </div>
            </div>

            <!-- Server 2: Restricted Tools (Hidden from Tier 3 Guests) -->
            <div class="card restricted" id="server2">
                <div class="card-header">
                    <span class="card-title">Sentinel Tools</span>
