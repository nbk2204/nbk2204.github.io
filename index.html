<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBK NEXUS // Secure Access</title>
    <style>
        :root {
            --bg-color: #0a051b;
            --glass-panel: rgba(20, 10, 35, 0.7);
            --neon-purple: #bc13fe;
            --neon-cyan: #00f3ff;
            --neon-red: #ff003c;
            --text-main: #e0d5f5;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', monospace;
            margin: 0;
            overflow-x: hidden;
        }

        /* LOGIN OVERLAY */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .login-box {
            background: rgba(10, 5, 20, 0.9);
            border: 1px solid var(--neon-cyan);
            padding: 40px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
            position: relative;
        }

        .login-box::before {
            content: "AUTHENTICATION REQUIRED";
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            background: var(--bg-color);
            padding: 0 10px;
            color: var(--neon-cyan);
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            padding: 10px;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
        }

        input:focus { border-color: var(--neon-purple); }

        button {
            width: 100%;
            padding: 10px;
            background: var(--neon-purple);
            border: none;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover { box-shadow: 0 0 15px var(--neon-purple); }

        /* DASHBOARD LAYOUT */
        #dashboard { display: none; padding: 20px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .admin-controls {
            display: none;
            background: rgba(255, 0, 60, 0.1);
            border: 1px solid var(--neon-red);
            padding: 10px;
            margin-bottom: 20px;
            color: var(--neon-red);
            font-size: 0.8rem;
        }

        /* GRID & SERVER CARDS */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--glass-panel);
            border: 1px solid rgba(188, 19, 254, 0.3);
            padding: 20px;
            border-radius: 8px;
            transition: 0.3s;
            position: relative;
        }

        .card.locked {
            filter: grayscale(100%) brightness(0.4);
            border-style: dashed;
        }

        .card.locked .server-link {
            display: none !important;
        }

        .card.locked::after {
            content: "🔒 LOCKED";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0055;
            font-weight: bold;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }
        
        .card.unlocked {
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.2);
            border-color: var(--neon-cyan);
        }

        .card.unlocked:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 25px var(--neon-cyan);
        }

        .server-link {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 15px;
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-cyan);
            text-decoration: none;
            border: 1px solid var(--neon-cyan);
        }
    </style>
</head>
<body>

    <!-- SECURE LOGIN OVERLAY -->
    <div id="login-overlay">
        <div class="login-box">
            <h2 style="margin-bottom: 20px;">SYSTEM ACCESS</h2>
            <input type="email" id="email" placeholder="OPERATOR ID (Email)">
            <input type="password" id="password" placeholder="ACCESS CODE (Password)">
            <button id="login-btn">INITIATE SEQUENCE</button>
            <p id="error-msg" style="color:red; font-size: 0.8rem; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard">
        <header>
            <div>
                <h1>NBK NEXUS</h1>
                <small id="user-display">GUEST MODE</small>
            </div>
            <button id="logout-btn" style="width: auto; background: #333;">ABORT SESSION</button>
        </header>

        <div id="admin-panel" class="admin-controls">
            <strong>⚠️ ROOT ACCESS GRANTED:</strong> Full system visibility enabled.
        </div>

        <div class="grid" id="server-grid"></div>
    </div>

    <!-- NATIVE BROWSER ES MODULE ENGINE -->
    <script type="module">
        // Direct secure imports from standard CDN unhindered by tracking blocks
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://gstatic.com";

        // --- 1. CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDnJUgPBsVxnteisxR6CZQ1_XZCHbp_s34",
            authDomain: "nbk-nexus.firebaseapp.com",
            projectId: "nbk-nexus",
            storageBucket: "nbk-nexus.firebasestorage.app",
            messagingSenderId: "324577021220",
            appId: "1:324577021220:web:99b0ed6f9f0831acf1f7b1",
            measurementId: "G-FPVH852M59"
        };

        // Initialize Secure Connection
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        console.log("NBK Nexus Module Core Active.");

        // --- 2. YOUR SERVERS CORE CONFIG ---
        const servers = [
            { id: 1, name: "PUBLIC NODE", desc: "Family & Friend Access", url: "https://google.com", minRole: "guest" },
            { id: 2, name: "MEDIA CORE", desc: "Plex / Streaming", url: "https://plex.tv", minRole: "friend" },
            { id: 3, name: "SENTINEL OPS", desc: "Security & Logs", url: "https://amazon.com", minRole: "admin" }
        ];

        // Attach action handlers to elements securely
        document.getElementById('login-btn').addEventListener('click', handleLogin);
        document.getElementById('logout-btn').addEventListener('click', logout);

        function handleLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            
            if (!email || !pass) {
                document.getElementById('error-msg').innerText = "CREDENTIALS REQUIRED";
                return;
            }

            document.getElementById('error-msg').innerText = "AUTHENTICATING NODE...";

            signInWithEmailAndPassword(auth, email, pass)
                .then((userCredential) => {
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    loadDashboard(userCredential.user.email);
                })
                .catch((error) => {
                    console.error(error);
                    document.getElementById('error-msg').innerText = "ACCESS DENIED: " + error.message;
                });
        }

        function logout() {
            signOut(auth).then(() => location.reload());
        }

        function loadDashboard(email) {
            document.getElementById('user-display').innerText = "OPERATOR: " + email;
            
            let role = "guest";
            // CHOOSE YOUR ADMIN EMAIL HERE
            if (email === "crazybuddiescreations@gmail.com") {
                role = "admin";
                document.getElementById('admin-panel').style.display = "block";
            } else if (email.toLowerCase().includes("friend")) {
                role = "friend";
            }

            const grid = document.getElementById('server-grid');
            grid.innerHTML = ""; 

            servers.forEach(server => {
                const card = document.createElement('div');
                let isUnlocked = false;

                if (role === "admin") isUnlocked = true;
                else if (role === "friend" && (server.minRole === "friend" || server.minRole === "guest")) isUnlocked = true;
                else if (role === "guest" && server.minRole === "guest") isUnlocked = true;

                card.className = `card ${isUnlocked ? "unlocked" : "locked"}`;
                card.innerHTML = `
                    <h3>${server.name}</h3>
                    <p style="color: #aaa; font-size: 0.9rem;">${server.desc}</p>
                    <a href="${server.url}" class="server-link" target="_blank">ACCESS TERMINAL</a>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
