<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBK NEXUS // Secure Command</title>
    
    <!-- 1. ALTERNATIVE "UNPKG" SOURCE (Bypasses most blockers) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        :root { --bg: #0a051b; --glass: rgba(20, 10, 35, 0.85); --purple: #bc13fe; --cyan: #00f3ff; --red: #ff003c; --text: #e0d5f5; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', monospace; margin: 0; overflow-x: hidden; min-height: 100vh; }
        
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 2, 10, 0.98); z-index: 9999; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .login-box { background: var(--glass); border: 1px solid var(--cyan); padding: 40px; width: 340px; text-align: center; box-shadow: 0 0 40px rgba(0, 243, 255, 0.1); border-radius: 8px; }
        
        input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid #333; padding: 12px; color: #fff; margin-bottom: 15px; outline: none; box-sizing: border-box; }
        input:focus { border-color: var(--purple); }
        
        .nexus-btn { width: 100%; padding: 12px; background: var(--purple); border: none; color: white; font-weight: bold; cursor: pointer; letter-spacing: 2px; transition: 0.3s; }
        .nexus-btn:hover { box-shadow: 0 0 20px var(--purple); }

        #dashboard { display: none; padding: 30px; }
        header { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 30px; }
        .admin-alert { display: none; background: rgba(255, 0, 60, 0.15); border: 1px solid var(--red); color: #ff99ab; padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .card { background: var(--glass); border: 1px solid rgba(188, 19, 254, 0.3); padding: 25px; border-radius: 10px; position: relative; transition: 0.3s; }
        .card.locked { filter: grayscale(100%) opacity(0.6); border-style: dashed; pointer-events: none; }
        .card.locked::after { content: "🔒 RESTRICTED"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; color: #fff; text-shadow: 0 0 10px #000; font-size: 1.2rem; }
        .card.unlocked:hover { transform: translateY(-5px); border-color: var(--cyan); box-shadow: 0 0 30px rgba(0, 243, 255, 0.2); }
        
        .link-btn { display: block; text-align: center; margin-top: 20px; padding: 10px; border: 1px solid var(--cyan); color: var(--cyan); text-decoration: none; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; transition: 0.3s; }
        .link-btn:hover { background: var(--cyan); color: #000; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2 style="margin-bottom: 20px; letter-spacing: 2px;">NBK NEXUS</h2>
            <input type="email" id="email" placeholder="OPERATOR ID (Email)">
            <input type="password" id="password" placeholder="ACCESS CODE (Password)">
            <button class="nexus-btn" onclick="attemptLogin()">INITIATE SEQUENCE</button>
            <p id="status-msg" style="color: #666; font-size: 0.8rem; margin-top: 15px;">System Standby...</p>
        </div>
    </div>

    <div id="dashboard">
        <header>
            <div>
                <h1 style="margin:0; text-shadow: 0 0 15px var(--purple);">NBK NEXUS</h1>
                <small id="user-display" style="color: var(--cyan); letter-spacing: 1px;">GUEST</small>
            </div>
            <button onclick="logout()" style="background: transparent; border: 1px solid #555; color: #fff; padding: 5px 15px; cursor: pointer;">LOGOUT</button>
        </header>

        <div id="admin-panel" class="admin-alert">
            <strong>⚠️ ROOT ACCESS:</strong> Full system control enabled.
        </div>

        <div class="grid" id="server-grid"></div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const firebaseConfig = {
  apiKey: "AIzaSyDnJUgPBsVxnteisxR6CZQ1_XZCHbp_s34",
  authDomain: "nbk-nexus.firebaseapp.com",
  projectId: "nbk-nexus",
  storageBucket: "nbk-nexus.firebasestorage.app",
  messagingSenderId: "324577021220",
  appId: "1:324577021220:web:99b0ed6f9f0831acf1f7b1",
  measurementId: "G-FPVH852M59"
        };

        const servers = [
            { id: 1, name: "PUBLIC NODE", desc: "General Access Portal", url: "https://google.com", minRole: "guest" },
            { id: 2, name: "MEDIA CORE", desc: "Plex & Streaming", url: "https://plex.tv", minRole: "friend" },
            { id: 3, name: "SENTINEL OPS", desc: "Security & Admin Tools", url: "https://amazon.com", minRole: "admin" }
        ];

        // --- 2. ROBUST INITIALIZER (Retries connection if blocked) ---
        let auth = null;
        
        function initSystem() {
            try {
                if (typeof firebase !== 'undefined') {
                    firebase.initializeApp(firebaseConfig);
                    auth = firebase.auth();
                    document.getElementById('status-msg').innerText = "System Online. Ready.";
                    document.getElementById('status-msg').style.color = "#00ff00";
                    console.log("Firebase Mounted.");
                } else {
                    throw new Error("Library pending...");
                }
            } catch (e) {
                console.log("Waiting for network...");
                // Retry in 1 second if network is slow
                setTimeout(initSystem, 1000); 
            }
        }
        
        // Start trying to connect immediately
        initSystem();

        // --- 3. LOGIN LOGIC ---
        function attemptLogin() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            const status = document.getElementById('status-msg');

            if (!auth) {
                status.innerText = "NETWORK ERROR: Firebase libraries blocked by browser/extension.";
                status.style.color = "#ff003c";
                // Final hail mary: try to load from alternative source if blocked
                const script = document.createElement('script');
                script.src = "https://gstatic.com";
                document.head.appendChild(script);
                return;
            }

            if (!email || !pass) {
                status.innerText = "CREDENTIALS REQUIRED";
                return;
            }

            status.innerText = "VERIFYING ENCRYPTION...";
            status.style.color = "#00f3ff";

            auth.signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    loadDashboard(userCredential.user.email);
                })
                .catch((error) => {
                    status.innerText = "ACCESS DENIED: " + error.code;
                    status.style.color = "#ff003c";
                });
        }

        function logout() {
            if(auth) auth.signOut().then(() => location.reload());
            else location.reload();
        }

        function loadDashboard(email) {
            document.getElementById('user-display').innerText = "OPERATOR: " + email.toUpperCase();
            
            let role = "guest";
            // UPDATE YOUR ADMIN EMAIL HERE
            if (email.toLowerCase() === "crazybuddiescreations@gmail.com".toLowerCase()) {
                role = "admin";
                document.getElementById('admin-panel').style.display = "block";
            } else if (email.toLowerCase().includes("friend")) {
                role = "friend";
            }

            const grid = document.getElementById('server-grid');
            grid.innerHTML = ""; 

            servers.forEach(server => {
                let isUnlocked = false;
                if (role === "admin") isUnlocked = true;
                else if (role === "friend" && (server.minRole === "friend" || server.minRole === "guest")) isUnlocked = true;
                else if (role === "guest" && server.minRole === "guest") isUnlocked = true;

                const card = document.createElement('div');
                card.className = `card ${isUnlocked ? "unlocked" : "locked"}`;
                card.innerHTML = `
                    <h3>${server.name}</h3>
                    <p style="color: #aaa; font-size: 0.9rem;">${server.desc}</p>
                    <a href="${server.url}" class="link-btn" target="_blank">${isUnlocked ? 'Connect' : 'Locked'}</a>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
